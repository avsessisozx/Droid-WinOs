name: Droid-WinOs release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build APK run id to publish"
        required: true
      tag:
        description: "Release tag"
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from the build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -n droiddeck-apk -D apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la apk
          cat > notes.md <<'N'
          Yeni: oyun tuşları ve fps kutusu gizlendi; gizliyken de ekran klavyesi düğmesi ekranda kalıyor.
          Yeni: eksik Windows dosyası (DLL) olursa ekranda hangisi olduğu yazar; İndirilenler/WinOs-DLL klasörüne koyunca otomatik yüklenir.
          Telefonda doğrulandı (Xiaomi Mi 10T Pro): kendi test programı, qBittorrent Portable kurulumu ve ana penceresi.
          Doğrulanmadı: dokunma, yazı yazma, ses, görev çubuklu tam masaüstü, Office gibi büyük programlar.
          N
          gh release create "${{ inputs.tag }}" apk/*.apk -R "${{ github.repository }}" --target "${{ github.sha }}" --title "Droid-WinOs ${{ inputs.tag }}" --notes-file notes.md --prerelease
